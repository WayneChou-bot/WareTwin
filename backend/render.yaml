# Render Blueprint — 在 Render 點 "New → Blueprint" 指向這個 repo 即可
services:
  - type: web
    name: warehouse-twin-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TWIN_SEED
        value: "42"
      - key: TWIN_DB
        value: /tmp/twin.db
      - key: TWIN_CORS_ORIGINS
        value: https://ware-twin.vercel.app   # 你的 Vercel 網域，多個用逗號分隔（設了之後 WS/POST 會檢查 Origin）
      - key: TWIN_CORS_REGEX
        value: https://ware-twin(-[a-z0-9-]+)?\.vercel\.app   # 只放自己專案的 Vercel preview（ware-twin-<hash>-<team>.vercel.app）
      - key: TWIN_TRUSTED_PROXIES
        value: "1"                            # Render 的 proxy 會把真實 IP 附加到 X-Forwarded-For 尾端
