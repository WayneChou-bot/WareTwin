# Render Blueprint — 在 Render 點 "New → Blueprint" 指向這個 repo 即可
services:
  - type: web
    name: warehouse-twin-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TWIN_SEED
        value: "42"
      - key: TWIN_DB
        value: /tmp/twin.db
      - key: TWIN_CORS_ORIGINS
        value: https://ware-twin.vercel.app   # 只允許正式網域（WS/POST 檢查 Origin）。要讓 Vercel preview 也能連，
                                              # 加 TWIN_CORS_REGEX=https://ware-twin-[a-z0-9]+-<你的 scope slug>\.vercel\.app
      - key: TWIN_TRUSTED_PROXIES
        value: "1"                            # Render 的 proxy 會把真實 IP 附加到 X-Forwarded-For 尾端
