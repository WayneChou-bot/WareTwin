<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#05080f"/></linearGradient>
  </defs>
  <rect width="1200" height="640" rx="16" fill="url(#bg)"/>
  <text x="32" y="44" fill="#e5eaf3" font-size="20" font-weight="700">WareTwin — architecture</text>
  <text x="32" y="66" fill="#8b98ad" font-size="12">Simulation → Twin State → WebSocket → Browser → 3D scene · AI reads the same state</text>

  <!-- Browser -->
  <rect x="32" y="92" width="420" height="500" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="120" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">BROWSER · React 18 + TypeScript + Vite</text>
  <rect x="52" y="136" width="380" height="118" rx="8" fill="#111c31" stroke="#1e3a8a"/>
  <text x="66" y="158" fill="#e5eaf3" font-size="12" font-weight="600">3D Digital Twin · React Three Fiber (WebGL2)</text>
  <text x="66" y="178" fill="#8b98ad" font-size="11">instanced racks · 20 AMRs · paths · zones</text>
  <text x="66" y="196" fill="#8b98ad" font-size="11">virtual CCTV render · heatmap / traffic / map views</text>
  <text x="66" y="214" fill="#8b98ad" font-size="11">quality tiers for iGPU · 10→60 Hz smoothing</text>
  <text x="66" y="238" fill="#64748b" font-size="10">components/scene · components/views</text>
  <rect x="52" y="264" width="182" height="118" rx="8" fill="#111c31" stroke="#1e293b"/>
  <text x="66" y="286" fill="#e5eaf3" font-size="12" font-weight="600">Command-center UI</text>
  <text x="66" y="306" fill="#8b98ad" font-size="11">Fleet · Tasks · KPI · Alerts</text>
  <text x="66" y="322" fill="#8b98ad" font-size="11">Audit log · Robot detail</text>
  <text x="66" y="338" fill="#8b98ad" font-size="11">Scenarios · AI Ops · What-if</text>
  <text x="66" y="366" fill="#64748b" font-size="10">components/panels · ops</text>
  <rect x="250" y="264" width="182" height="118" rx="8" fill="#111c31" stroke="#1e293b"/>
  <text x="264" y="286" fill="#e5eaf3" font-size="12" font-weight="600">Twin State store</text>
  <text x="264" y="306" fill="#8b98ad" font-size="11">zustand · single source</text>
  <text x="264" y="322" fill="#8b98ad" font-size="11">FULL / PATCH merge</text>
  <text x="264" y="338" fill="#8b98ad" font-size="11">RESYNC on gaps</text>
  <text x="264" y="366" fill="#64748b" font-size="10">state/store · services/ws</text>
  <rect x="52" y="392" width="380" height="82" rx="8" fill="#1a1608" stroke="#78350f" stroke-dasharray="4 3"/>
  <text x="66" y="414" fill="#fbbf24" font-size="12" font-weight="600">Local fallback engine (TypeScript)</text>
  <text x="66" y="434" fill="#a16207" font-size="11">same FSM / A* / Fleet Manager — takes over</text>
  <text x="66" y="450" fill="#a16207" font-size="11">when the backend is unreachable (badge: LOCAL)</text>
  <text x="52" y="500" fill="#64748b" font-size="10">schema/twin_state.ts — the contract shared with the backend</text>
  <text x="52" y="560" fill="#475569" font-size="10">Deploy: Vercel (static)</text>

  <!-- link -->
  <line x1="452" y1="300" x2="548" y2="300" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <rect x="455" y="306" width="92" height="54" rx="6" fill="#0b1220" stroke="#1e3a8a"/>
  <text x="501" y="324" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">WebSocket</text>
  <text x="501" y="338" fill="#8b98ad" font-size="9" text-anchor="middle">FULL · PATCH/tick</text>
  <text x="501" y="351" fill="#8b98ad" font-size="9" text-anchor="middle">~12 KB/s @ 1×</text>
  <text x="501" y="290" fill="#64748b" font-size="9.5" text-anchor="middle">+ REST /api/*</text>

  <!-- Backend -->
  <rect x="548" y="92" width="620" height="500" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="568" y="120" fill="#86efac" font-size="13" font-weight="700" letter-spacing="1">BACKEND · FastAPI + Pydantic v2 + asyncio</text>

  <rect x="568" y="136" width="300" height="200" rx="8" fill="#0c1f16" stroke="#166534"/>
  <text x="582" y="158" fill="#e5eaf3" font-size="12" font-weight="600">SimEngine · deterministic, 100 ms tick</text>
  <text x="582" y="180" fill="#8b98ad" font-size="11">Robot FSM · low-battery task transfer</text>
  <text x="582" y="196" fill="#8b98ad" font-size="11">A* on 1 m grid · traffic-weighted · 8-direction</text>
  <text x="582" y="212" fill="#8b98ad" font-size="11">Fleet Manager scoring · explainable candidates</text>
  <text x="582" y="228" fill="#8b98ad" font-size="11">Battery · chargers · conveyors · zones · sensors</text>
  <text x="582" y="244" fill="#8b98ad" font-size="11">Cell reservation · deadlock breaker (yield)</text>
  <text x="582" y="260" fill="#8b98ad" font-size="11">Scenario injection: robot · conveyor · human · traffic</text>
  <text x="582" y="276" fill="#8b98ad" font-size="11">KPI · events · alerts · heatmaps</text>
  <text x="582" y="300" fill="#64748b" font-size="10">app/sim/engine.py · astar.py  ≈ 0.3 ms / tick</text>
  <text x="582" y="320" fill="#64748b" font-size="10">PRNG bit-identical to the TS engine</text>

  <rect x="884" y="136" width="264" height="92" rx="8" fill="#0c1f16" stroke="#166534"/>
  <text x="898" y="158" fill="#e5eaf3" font-size="12" font-weight="600">What-if</text>
  <text x="898" y="178" fill="#8b98ad" font-size="11">engine.clone() ×2 → baseline / scenario</text>
  <text x="898" y="194" fill="#8b98ad" font-size="11">run N ticks → 12-metric delta</text>
  <text x="898" y="210" fill="#8b98ad" font-size="11">LIVE untouched · ~2 s for 5 min</text>

  <rect x="884" y="244" width="264" height="92" rx="8" fill="#1a1030" stroke="#6d28d9"/>
  <text x="898" y="266" fill="#e5eaf3" font-size="12" font-weight="600">AI (optional OpenAI key)</text>
  <text x="898" y="286" fill="#8b98ad" font-size="11">Copilot: state summary → JSON reply</text>
  <text x="898" y="302" fill="#8b98ad" font-size="11">VLM: CCTV frame → event · bbox · conf.</text>
  <text x="898" y="318" fill="#c4b5fd" font-size="11">no key → rule-based / simulated</text>

  <rect x="568" y="352" width="580" height="64" rx="8" fill="#111c31" stroke="#1e293b"/>
  <text x="582" y="374" fill="#e5eaf3" font-size="12" font-weight="600">Twin State (dict, validated by Pydantic at the edges)</text>
  <text x="582" y="394" fill="#8b98ad" font-size="11">robots · tasks · zones · conveyors · cameras · sensors · people · alerts · events · decisions · kpi</text>
  <text x="582" y="408" fill="#64748b" font-size="10">app/schema.py ≡ docs/schema/twin_state.py ≡ frontend/twin_state.ts</text>

  <rect x="568" y="432" width="280" height="60" rx="8" fill="#111c31" stroke="#1e293b"/>
  <text x="582" y="454" fill="#e5eaf3" font-size="12" font-weight="600">SQLite (→ PostgreSQL later)</text>
  <text x="582" y="474" fill="#8b98ad" font-size="11">events · kpi snapshots · decisions</text>
  <rect x="868" y="432" width="280" height="60" rx="8" fill="#111c31" stroke="#1e293b"/>
  <text x="882" y="454" fill="#e5eaf3" font-size="12" font-weight="600">Simulation loop</text>
  <text x="882" y="474" fill="#8b98ad" font-size="11">real time × speed → ticks → diff → send</text>

  <text x="568" y="560" fill="#475569" font-size="10">Deploy: Render / Fly.io / any container (long-running WebSocket)</text>

  <!-- arrows inside backend -->
  <line x1="718" y1="336" x2="718" y2="352" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1016" y1="228" x2="1016" y2="244" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1016" y1="336" x2="1016" y2="352" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="868" y1="180" x2="884" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="718" y1="416" x2="718" y2="432" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1008" y1="416" x2="1008" y2="432" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="568" y="616" fill="#475569" font-size="10">Phase 7 (optional): feed robot poses from ROS 2 / Webots into SimEngine.step() — contract and UI unchanged.</text>
</svg>
